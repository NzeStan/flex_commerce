# Generated by scripts/gen_packaging.py — edit that script, not this file.
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flexcommerce"
version = "1.0.0"
description = "FlexCommerce: a complete, modular e-commerce and marketplace backend for Django (Nigeria/Africa ready)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NzeStan", email = "nnamaniifeanyi10@gmail.com" }]
keywords = ["django", "ecommerce", "flexcommerce", "nigeria", "africa", "drf", "marketplace", "shop", "jumia", "konga"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"
dependencies = [
    "flexcommerce-core>=1.0.0,<2",
    "flexcommerce-catalog>=1.0.0,<2",
    "flexcommerce-pricing>=1.0.0,<2",
    "flexcommerce-inventory>=1.0.0,<2",
    "flexcommerce-discounts>=1.0.0,<2",
    "flexcommerce-shipping>=1.0.0,<2",
    "flexcommerce-cart>=1.0.0,<2",
    "flexcommerce-orders>=1.0.0,<2",
    "flexcommerce-payments>=1.0.0,<2",
    "flexcommerce-checkout>=1.0.0,<2",
    "flexcommerce-engagement>=1.0.0,<2",
    "flexcommerce-notifications>=1.0.0,<2",
    "flexcommerce-analytics>=1.0.0,<2",
]

[project.optional-dependencies]
marketplace = ["flexcommerce-marketplace>=1.0.0,<2"]
celery = ["celery>=5.3"]
fcm = ["google-auth>=2.20", "requests>=2.28"]
all = ["flexcommerce-marketplace>=1.0.0,<2", "celery>=5.3", "google-auth>=2.20", "requests>=2.28"]

[project.urls]
Homepage = "https://github.com/NzeStan/flex_commerce"
Documentation = "https://github.com/NzeStan/flex_commerce#readme"
Repository = "https://github.com/NzeStan/flex_commerce"
Issues = "https://github.com/NzeStan/flex_commerce/issues"
Changelog = "https://github.com/NzeStan/flex_commerce/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["flexcommerce*"]
