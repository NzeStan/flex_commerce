<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f5f7;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;">
          <tr>
            <td style="padding:24px 32px;border-bottom:1px solid #e4e7eb;font-size:20px;font-weight:bold;">{{ store_name }}</td>
          </tr>
          <tr>
            <td style="padding:24px 32px;font-size:15px;line-height:1.6;">
              <h1 style="font-size:18px;margin:0 0 16px;">{{ subject }}</h1>
              {{ body_html }}
              {% if order_url %}<p style="margin-top:24px;"><a href="{{ order_url }}" style="background:#f68b1e;color:#ffffff;padding:10px 18px;border-radius:4px;text-decoration:none;">View your order</a></p>{% endif %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px;border-top:1px solid #e4e7eb;font-size:12px;color:#7b8794;">
              You are receiving this email because of your activity with {{ store_name }}.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
